<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    if (location.hash === "" || location.hash === "#") {
      history.replaceState(null, "", location.pathname + location.search);
    }
    window.scrollTo(0, 0);
  </script>
  <style>
    a { color: inherit; text-decoration: none; }
    body { margin: 0; color: #141414; background: #fff; }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transform: translate3d(0, 0, 0);
    }
    .header--over { color: #fff; background: transparent; }
    .header--solid { color: #035c8c; background: #fff; }
    .header.is-hidden { transform: translate3d(0, -100%, 0); }
  </style>
  <link rel="stylesheet" href="/src/styles/main.sass" />
</head>
